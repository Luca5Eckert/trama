name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trama?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Resolve modules
        run: |
          go mod tidy
          echo '--- go.mod ---'
          cat go.mod
          echo '--- go.sum ---'
          cat go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
